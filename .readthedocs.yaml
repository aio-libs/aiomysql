# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-26.04
  tools:
    # 3.15 is not yet supported as of 2026-11-04, to be bumped once available
    python: "3.14"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
- pdf
- epub

python:
  install:
  - requirements: requirements-docs.txt
  - method: pip
    path: .
